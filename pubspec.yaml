name: montaser_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Arabic month names, weekday names and number formatting come from here.
  #
  # The version is not ours to choose: flutter_localizations pins it, and the
  # pin moves when the Flutter SDK does. Held to an exact version once, which
  # is why an SDK upgrade stopped the project resolving at all — the pin said
  # 0.20.2 and the SDK had gone to ^0.20.3.
  #
  # A caret range follows the SDK instead of arguing with it. Raise the floor
  # only if a future SDK needs it.
  intl: ^0.20.3

  # Declarative routes. A shop is full of links worth being able to reopen —
  # a product, an order — and a route table that lives in one file is the
  # difference between that and a stack of pushes nobody can name.
  go_router: ^17.5.0

  # Arabic Material widgets: date pickers, dialogs, and the text direction
  # itself. Without it every built-in string stays English inside an RTL app.
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # The app icon and the splash screen, generated from one picture each.
  #
  # Dev dependencies rather than shipped code: they run once, write the icons
  # and launch screens into the android/ and ios/ folders, and are not part of
  # the app at all. Generating them beats hand-cutting a dozen sizes, and it
  # means the day the shop changes its mark it is one file and one command
  # rather than an afternoon in an image editor getting one size wrong.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # Cairo, under the SIL Open Font License.
  #
  # Bundled rather than fetched at run time: a shop that downloads its own
  # typeface on first launch shows the customer a different app for the first
  # second than the one they will use afterwards, and shows them nothing at all
  # on a bad connection.
  #
  # Two weights only, so the type scale is designed around 400 and 700. Asking
  # for a 600 that is not here would not produce a semibold — Flutter would pick
  # the nearer of the two and the intent would vanish in the gap.
  assets:
    # The shop's own mark, used by the icon and splash generators and
    # available to the app itself where a drawn placeholder will not do.
    - assets/brand/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------------------------------------------------------------------------
# The app icon
# ---------------------------------------------------------------------------
#
# Generated from one square picture. Put the shop's mark at
# `assets/brand/icon.png` — square, at least 1024×1024, and with the artwork
# inset a little from the edge, because both platforms round the corners and
# Android may crop it to a circle.
#
# Then run:
#
#     dart run flutter_launcher_icons
#
# `adaptive_icon_background` is the colour behind the mark on Android, where the
# system decides the shape. White, because the mark itself is drawn on white and
# a coloured plate behind it would put a ring around the artwork.
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/icon.png

# ---------------------------------------------------------------------------
# The splash screen
# ---------------------------------------------------------------------------
#
# What the customer looks at while the app wakes. The same mark, centred on the
# same white, so opening the app is one continuous picture rather than an icon
# that flashes into something else.
#
# Then run:
#
#     dart run flutter_native_splash:create
#
# `android_12` is its own block because Android 12 changed how this works: the
# system draws a circle of fixed size and ignores the old settings entirely.
flutter_native_splash:
  # The app's page colour in each theme (Palette.canvas / Palette.darkCanvas),
  # so the system splash hands over to the in-app one without a change of
  # background. The logo is transparent; in the dark theme its navy lettering
  # would vanish, so splash_dark.png has "MONTASER" and the Arabic name in the
  # logo's own orange instead.
  color: "#F3F8F9"
  image: assets/brand/splash.png
  color_dark: "#071316"
  image_dark: assets/brand/splash_dark.png
  android: true
  ios: true
  # Its own picture, because Android 12+ shows the splash image through a
  # circle two-thirds as wide as the image: splash.png runs to its corners, and
  # the circle cut "MONTASER" and the Arabic name off. This is the same logo on
  # a 1152 px canvas, inside the 768 px circle Android keeps.
  android_12:
    color: "#F3F8F9"
    image: assets/brand/splash_android12.png
    color_dark: "#071316"
    image_dark: assets/brand/splash_android12_dark.png
